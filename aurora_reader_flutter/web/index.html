<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mystical ebook reader — read in the shadows of the stave">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Edda">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Edda</title>
  <link rel="manifest" href="manifest.json">

  <meta name="theme-color" content="#0D1210">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0D1210;
      overflow: hidden;
    }

    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      background-color: #0D1210;
    }

    #loading .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(184, 121, 68, 0.2);
      border-top: 4px solid #B87944;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    #loading p {
      margin-top: 16px;
      color: #B87944;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 18px;
      letter-spacing: 6px;
      font-weight: 700;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p>EDDA</p>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
