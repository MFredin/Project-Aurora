name: aurora_reader
description: Aurora Reader — Cross-platform ebook reader with Northern Lights theme
publish_to: 'none'
version: 4.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Routing
  go_router: ^13.0.1

  # Local Database (SQLite ORM — replaces SwiftData)
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.1
  path: ^1.8.3

  # Networking
  dio: ^5.4.0
  connectivity_plus: ^5.0.2

  # Authentication / OAuth
  flutter_appauth: ^6.0.3
  flutter_secure_storage: ^9.0.0

  # EPUB Parsing
  epubx: ^4.0.2
  archive: ^3.4.10
  xml: ^6.5.0
  html: ^0.15.4

  # PDF
  pdfrx: ^1.0.68

  # File Handling
  file_picker: ^6.1.1
  share_plus: ^7.2.1
  open_file: ^3.3.2

  # Audio (Ambient Soundscapes + TTS)
  just_audio: ^0.9.36
  flutter_tts: ^4.0.2

  # Persistence (IndexedDB on web, file-based on native)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Web platform support
  web: ^1.0.0

  # UI Components
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fl_chart: ^0.66.0

  # Cloud Storage
  google_sign_in: ^6.2.1
  googleapis: ^12.0.0
  # dropbox_client: from git or custom implementation

  # iCloud / Cross-platform Sync
  cloud_firestore: ^4.14.0
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0

  # Utilities
  uuid: ^4.2.2
  intl: ^0.19.0
  url_launcher: ^6.2.2
  collection: ^1.18.0
  crypto: ^3.0.3
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  drift_dev: ^2.14.1
  json_serializable: ^6.7.1
  freezed: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: OpenDyslexic
      fonts:
        - asset: assets/fonts/OpenDyslexic-Regular.otf
        - asset: assets/fonts/OpenDyslexic-Bold.otf
          weight: 700
