name: aurora_reader
description: Aurora Reader — Cross-platform ebook reader with Northern Lights theme
publish_to: 'none'
version: 4.0.0+1

environment:
  sdk: '>=3.6.2 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.3.1

  # Routing
  go_router: ^17.2.3

  # Persistence (IndexedDB on web, file-based on native)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # EPUB Parsing
  epubx: ^4.0.0
  image: ^4.0.1
  html: ^0.15.6

  # File Import
  file_picker: ^11.0.2

  # Charts (Activity screen)
  fl_chart: ^1.2.0

  # Utilities
  uuid: ^4.5.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: OpenDyslexic
      fonts:
        - asset: assets/fonts/OpenDyslexic-Regular.otf
        - asset: assets/fonts/OpenDyslexic-Bold.otf
          weight: 700
