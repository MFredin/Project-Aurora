name: aurora_reader
description: Edda — Cross-platform ebook reader with a mystical Nordic aesthetic
publish_to: 'none'
version: 4.0.0+1

environment:
  sdk: '>=3.6.2 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.3.1

  # Routing
  go_router: ^17.2.3

  # Persistence (IndexedDB on web, file-based on native)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # EPUB Parsing
  epubx: ^4.0.0
  image: ^3.3.0
  html: ^0.15.6

  # File Import
  file_picker: ^11.0.2
  desktop_drop: ^0.5.0

  # Charts (Activity screen)
  fl_chart: ^1.2.0

  # Database
  drift: ^2.26.0

  # Networking
  dio: ^5.8.0

  # Audio
  just_audio: ^0.9.43

  # Utilities
  uuid: ^4.5.3
  intl: ^0.19.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/fonts/

