<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ember" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B87944"/>
      <stop offset="100%" style="stop-color:#9A6338"/>
    </linearGradient>
    <linearGradient id="lichen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5A9E8F"/>
      <stop offset="60%" style="stop-color:#3D7A6D"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="#0D1210"/>
  <circle cx="256" cy="256" r="248" fill="none" stroke="#252E27" stroke-width="2"/>

  <!-- Bind Rune: Ehwaz + Dagaz on shared stave -->

  <!-- Central vertical stave -->
  <line x1="256" y1="72" x2="256" y2="440" stroke="url(#ember)" stroke-width="14" stroke-linecap="square"/>

  <!-- Dagaz: X-cross diagonals forming bowtie -->
  <line x1="256" y1="72" x2="420" y2="256" stroke="url(#lichen)" stroke-width="11" stroke-linecap="square"/>
  <line x1="420" y1="256" x2="256" y2="440" stroke="url(#lichen)" stroke-width="11" stroke-linecap="square"/>
  <line x1="256" y1="72" x2="92" y2="256" stroke="url(#lichen)" stroke-width="11" stroke-linecap="square"/>
  <line x1="92" y1="256" x2="256" y2="440" stroke="url(#lichen)" stroke-width="11" stroke-linecap="square"/>

  <!-- Ehwaz: chevron branches from upper stave -->
  <line x1="256" y1="152" x2="380" y2="216" stroke="url(#ember)" stroke-width="12" stroke-linecap="square"/>
  <line x1="380" y1="216" x2="256" y2="280" stroke="url(#ember)" stroke-width="12" stroke-linecap="square"/>

  <!-- Stave terminal serifs -->
  <line x1="228" y1="72" x2="284" y2="72" stroke="url(#ember)" stroke-width="10" stroke-linecap="square"/>
  <line x1="228" y1="440" x2="284" y2="440" stroke="url(#ember)" stroke-width="10" stroke-linecap="square"/>
</svg>
